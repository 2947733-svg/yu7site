name: Deploy to yu7.site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-yu7site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Trigger git pull on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              -p 1500 \
              u9408526@server157.hosting.reg.ru \
              'set -e; cd ~/www/yu7.site && git fetch origin master && git merge --ff-only origin/master && echo === && git log --oneline -3 && date'

      - name: Verify live site
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://yu7.site/master-account.html)
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site not 200"
            exit 1
          fi
          curl -s https://yu7.site/master-account.html | grep -q 'id="verification"' \
            && echo "✅ verification anchor found" \
            || echo "⚠️ verification anchor not yet visible (may need cache invalidation)"
